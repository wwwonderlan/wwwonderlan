<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" id="theme-color" content="#000000">

<title>wwwonderlan — Film poster prints</title>
<meta name="description" content="Film poster prints in maxi size. Fallen Angels, Taipei Story, Millennium Mambo.">
<link rel="canonical" href="https://wwwonderlan.com/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://wwwonderlan.com/">
<meta property="og:title" content="wwwonderlan — Film poster prints">
<meta property="og:description" content="Film poster prints in maxi size. Fallen Angels, Taipei Story, Millennium Mambo.">
<meta property="og:image" content="https://pub-01259ba9a4fe4eccabe8b5baf85baa7a.r2.dev/fallen-angels.jpg">
<meta name="twitter:card" content="summary_large_image">

<!-- Must run before first paint, or the wrong theme flashes. Dark is the
     default; only a previous choice moves it. -->
<script>
(() => {
  let stored;
  try { stored = localStorage.getItem("wwwonderlan-theme"); } catch {}
  if (stored !== "light") return;
  document.documentElement.dataset.theme = "light";
  document.getElementById("theme-color").setAttribute("content", "#FFFFFF");
})();
</script>

<link rel="preload" href="fonts/HelveticaNowDisplay-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/HelveticaNowDisplay-Medium.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="frame">

  <main>
    <h1 class="visually-hidden">Film poster prints</h1>

    <!-- Populated from the posters array in app.js -->
    <ul class="grid" id="grid"></ul>

    <noscript>
      <p class="fallback">
        This site needs JavaScript to list the prints.
        <a href="https://wwwonderlan.etsy.com/uk">View the shop on Etsy</a>.
      </p>
    </noscript>
  </main>

  <nav class="dock" aria-label="Menu">
    <div class="dock-progress" id="scroll-progress"
         role="progressbar" aria-label="Page scrolled"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="dock-progress-fill" id="scroll-progress-fill"></div>
    </div>

    <div class="dock-panel">
      <img class="dock-logo is-light-only" src="wwwonderlan-black.png" alt="wwwonderlan">
      <img class="dock-logo is-dark-only" src="wwwonderlan-white.png" alt="wwwonderlan">

      <ul class="dock-menu">
        <li><a href="https://wwwonderlan.etsy.com/uk" target="_blank" rel="noopener">Shop</a></li>
        <li><a href="#details">Details</a></li>
        <li><a href="https://instagram.com/wwwonderlan" target="_blank" rel="noopener">Instagram</a></li>
      </ul>

      <div class="dock-footer">
        <div class="dock-controls">
          <button class="dock-control" type="button"
                  data-set-theme="light" aria-label="Light mode">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>

          <button class="dock-control" type="button"
                  data-set-theme="dark" aria-label="Dark mode">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>

          <button class="dock-control" type="button"
                  id="scroll-top" aria-label="Back to top">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 12 7-7 7 7"/>
              <path d="M12 19V5"/>
            </svg>
          </button>
        </div>
        <p class="dock-copyright">© 2026 wwwonderlan</p>
      </div>
    </div>
  </nav>

</div>

<script src="app.js"></script>

</body>
</html>
